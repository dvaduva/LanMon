{% extends "base.html" %}
{% from "_macros.html" import csrf, icon with context %}
{% block title %}Cont · LanMon{% endblock %}
{% block content %}
<h1>Cont</h1>
<p class="muted">Autentificat ca <strong>{{ user.username }}</strong>.</p>
<form method="post" action="/account/password" class="card">
  <h2>Schimbă parola</h2>
  {{ csrf() }}
  <label>Parola actuală <input type="password" name="current" required autocomplete="current-password"></label>
  <label>Parola nouă <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <label>Confirmă parola nouă <input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
  <button class="primary">{{ icon("key") }} Schimbă parola</button>
</form>
<form method="post" action="/logout">
  {{ csrf() }}
  <button>{{ icon("log-out") }} Ieșire</button>
</form>
{% endblock %}
