{% extends "base.html" %}
{% from "_macros.html" import ago, csrf, icon with context %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Dashboard</h1>
  </div>
  <div class="head-actions">
    <div class="segmented" role="group" aria-label="Afișare">
      <button type="button" data-view-toggle="list" title="Listă" aria-pressed="true">{{ icon("list") }}<span class="sr">Listă</span></button>
      <button type="button" data-view-toggle="tiles" title="Tile-uri" aria-pressed="false">{{ icon("layout-grid") }}<span class="sr">Tile-uri</span></button>
    </div>
    <form method="post" action="/scan">
      {{ csrf() }}
      <button title="Scanează acum">{{ icon("radar") }}<span class="wide-only">Scanează acum</span></button>
    </form>
  </div>
</div>
{# Aplicat înainte de afișare, ca să nu clipească lista înainte de tile-uri. #}
<script>try { if (localStorage.getItem("lanmon:view") === "tiles") document.documentElement.dataset.view = "tiles"; } catch (e) {}</script>
{% include "_dashboard_groups.html" %}
{% endblock %}
