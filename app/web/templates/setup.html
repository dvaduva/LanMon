{% extends "auth_base.html" %}
{% from "_macros.html" import csrf, icon with context %}
{% block title %}Configurare · LanMon{% endblock %}
{% block content %}
<form method="post" action="/setup" class="card narrow">
  <h1>Bun venit în LanMon</h1>
  <p class="muted">Creează contul de administrator. Îl vei folosi pentru a intra în aplicație.</p>
  {{ csrf() }}
  <label>Utilizator <input name="username" value="{{ username }}" required autocomplete="username"></label>
  <label>Parolă <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
  <label>Confirmă parola <input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
  <button class="primary">Creează contul</button>
</form>
{% endblock %}
